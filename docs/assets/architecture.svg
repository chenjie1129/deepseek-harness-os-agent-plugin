<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box { rx: 8; ry: 8; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .mono { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
      .monosm { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
      .lbl { font-size: 11px; fill: #6e7781; }
      .grouplbl { font-size: 11px; font-weight: 600; fill: #8b949e; letter-spacing: .08em; }
      .edge { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Harness group -->
  <rect x="24" y="46" width="392" height="382" class="box" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="40" y="68" class="grouplbl">DEEPSEEK HARNESS</text>

  <!-- Model / agent loop -->
  <rect x="48" y="84" width="344" height="58" class="box" fill="#ffffff" stroke="#d0d7de"/>
  <text x="64" y="107" class="title">Model + agent loop</text>
  <text x="64" y="127" class="sub">natural-language task in, answer out</text>

  <!-- Plugin box -->
  <rect x="48" y="178" width="344" height="152" class="box" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="64" y="201" class="title">OS Agent Plugin</text>
  <text x="64" y="220" class="monosm">dsh-os-agent-plugin</text>

  <rect x="64" y="232" width="150" height="38" class="box" fill="#ffffff" stroke="#a2d6ff"/>
  <text x="76" y="249" class="mono">index.js</text>
  <text x="76" y="264" class="lbl">tools + settings</text>

  <rect x="226" y="232" width="150" height="38" class="box" fill="#ffffff" stroke="#a2d6ff"/>
  <text x="238" y="249" class="mono">volcengine.js</text>
  <text x="238" y="264" class="lbl">signed transport</text>

  <rect x="64" y="278" width="150" height="38" class="box" fill="#ffffff" stroke="#a2d6ff"/>
  <text x="76" y="295" class="mono">web-config.js</text>
  <text x="76" y="310" class="lbl">settings tab</text>

  <rect x="226" y="278" width="150" height="38" class="box" fill="#ffffff" stroke="#a2d6ff"/>
  <text x="238" y="295" class="mono">cordis.patch.yml</text>
  <text x="238" y="310" class="lbl">runtime mount</text>

  <!-- Credential store -->
  <rect x="48" y="356" width="344" height="52" class="box" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="64" y="378" class="title">Harness credential store</text>
  <text x="64" y="396" class="monosm">VOLC_ACCESSKEY · VOLC_SECRETKEY</text>

  <!-- Volcengine group -->
  <rect x="512" y="46" width="344" height="290" class="box" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="528" y="68" class="grouplbl">VOLCENGINE</text>

  <rect x="536" y="84" width="296" height="94" class="box" fill="#ffffff" stroke="#d0d7de"/>
  <text x="552" y="107" class="title">Mobile Use OpenAPI</text>
  <text x="552" y="128" class="monosm">RunAgentTaskOneStep</text>
  <text x="552" y="145" class="monosm">ListAgentRunCurrentStep</text>
  <text x="552" y="162" class="monosm">GetAgentResult</text>

  <rect x="536" y="198" width="296" height="62" class="box" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="552" y="221" class="title">Cloud phone</text>
  <text x="552" y="240" class="sub">ProductId · PodId — taps, types, screenshots</text>

  <rect x="536" y="276" width="296" height="44" class="box" fill="#ffffff" stroke="#d0d7de"/>
  <text x="552" y="298" class="title">TOS bucket</text>
  <text x="552" y="314" class="sub">optional screen recordings</text>

  <!-- Edges: model <-> plugin -->
  <path class="edge" d="M 120 142 L 120 178"/>
  <text x="130" y="164" class="lbl">tool calls</text>
  <path class="edge" d="M 320 178 L 320 142"/>
  <text x="310" y="164" class="lbl" text-anchor="end">results</text>

  <!-- plugin -> credentials -->
  <path class="edge" d="M 120 330 L 120 356"/>
  <text x="130" y="348" class="lbl">resolve keys</text>

  <!-- plugin -> API -->
  <path class="edge" d="M 392 240 L 536 145"/>
  <text x="466" y="255" class="lbl" text-anchor="middle">HTTPS · HMAC-SHA256</text>

  <!-- API -> phone -->
  <path class="edge" d="M 684 178 L 684 198"/>

  <!-- phone -> TOS -->
  <path class="edge" d="M 684 260 L 684 276"/>

  <!-- Tool lifecycle strip -->
  <rect x="24" y="450" width="832" height="30" class="box" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="470" class="monosm">mobile_use_start_task</text>
  <text x="196" y="470" class="lbl">→ RunId →</text>
  <text x="266" y="470" class="monosm">mobile_use_get_status</text>
  <text x="424" y="470" class="lbl">→ poll until done →</text>
  <text x="544" y="470" class="monosm">mobile_use_get_result</text>
  <text x="700" y="470" class="lbl">→ answer to user</text>
</svg>
